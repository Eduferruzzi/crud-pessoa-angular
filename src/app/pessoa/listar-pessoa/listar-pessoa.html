<h1>Pessoas</h1>

<table class="table table-striped table-bordered table-hover">
    <tbody>
        <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Data de Nascimento</th>
            <th class="text-center">
                <a [routerLink]="['/pessoas/novo']" href="#" title="Novo" alt="Novo" class="btn btn-xs btn-success">
                    <i class="fa fa-plus" aria-hidden="true"></i> Novo
                </a>
            </th>
        </tr>
        @for (pessoa of pessoas; track pessoa.id) {
            <tr>
                <td>{{ pessoa.nome }}</td>
                <td>{{ pessoa.idade }}</td>
                <td>{{ pessoa.dataNasc }}</td>
                <td class="text-center" style="width: 300px">
                    <a [routerLink]="['/pessoas/editar', pessoa.id]" href="#" title="Editar" alt="Editar" class="btn btn-xs btn-info">
                        <i class="fa fa-edit" aria-hidden="true"></i> Editar
                    </a>
                    <a href="#" title="Remover" alt="Remover" class="btn btn-xs btn-danger"
                        (click)="remover($event, pessoa)">
                        <i class="fa fa-times" aria-hidden="true"></i> Remover
                    </a>
                </td> 
            </tr>
        }
        @empty {
            <tr>
                <td colspan="4">Nenhuma pessoa cadastrada</td>
            </tr>
        }
    </tbody>
</table>
