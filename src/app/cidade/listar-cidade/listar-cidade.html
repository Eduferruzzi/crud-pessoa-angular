<h1>Cidades</h1>

<table class="table table-striped table-bordered table-hover">
    <tbody>
        <tr>
            <th>Nome</th>
            <th>Estado</th>
            <th class="text-center">
                <a [routerLink]="['/cidades/novo']" href="#" title="Novo" alt="Novo" class="btn btn-xs btn-success">
                    <i class="fa fa-plus" aria-hidden="true"></i> Novo
                </a>
            </th>
        </tr>
        @for (cidade of cidades; track cidade.id){
            <tr>
                <td>{{ cidade.nome }}</td>
                <td>{{ cidade.estado }}</td>
                <td class="text-center" style="width: 300px">
                    <a [routerLink]="['/cidades/editar', cidade.id]" href="#" title="Editar" alt="Editar" class="btn btn-xs btn-info">
                        <i class="fa fa-edit" aria-hidden="true"></i> Editar
                    </a>
                    <a href="#" title="Remover" alt="Remover" class="btn btn-xs btn-danger" (click)="remover($event, cidade)">
                        <i class="fa fa-times" aria-hidden="true"></i> Remover
                    </a>
                </td>
            </tr>
        }
        @empty {
            <tr>
                <td colspan="3">Nenhuma pessoa cadastrada</td>
            </tr>
        }
    </tbody>
</table>
