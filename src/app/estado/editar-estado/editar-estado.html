<h1>Novo Estado</h1>

<div class="well">
    <form #formEstado="ngForm">
        <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" class="form-control" id="nome" name="nome"
            [(ngModel)]="estado.nome"
            #nome="ngModel"
            minlength="2" required>
            @if (nome.errors && (nome.dirty || nome.touched)) {
                <div class="alert alert-danger">
                    <div [hidden]="!nome.errors['required']"> Digite o nome da estado. </div>
                    <div [hidden]="!nome.errors['minlength']"> O nome deve conter ao menos 2 caracteres. </div>
                </div>
            }
        </div>
        <div class="form-group">
            <label for="sigla">Sigla:</label>
            <input type="text" class="form-control" id="sigla" name="sigla"
            [(ngModel)]="estado.sigla"
            #sigla="ngModel"
            minlength="2" maxlength="2" required>
            @if (sigla.errors && (sigla.dirty || sigla.touched)) {
                <div class="alert alert-danger">
                    <div [hidden]="!sigla.errors['required']"> Digite a sigla do estado. </div>
                    <div [hidden]="!sigla.errors['minlength']"> A sigla deve conter 2 caracteres. </div>
                    <div [hidden]="!sigla.errors['manlength']"> A sigla deve conter 2 caracteres. </div>
                </div>
            }
        </div>
        <div class="form-group">
            <button type="button" class="btn btn-primary"
                (click)="atualizar()" [disabled]="!formEstado.form.valid">
                <i class="fa fa-save"></i> Atualizar
            </button>
            <a [routerLink]="['/estados']" class="btn btn-secondary">
                <i class="fa fa-arrow-left"></i> Voltar
            </a>
        </div>
    </form>
</div>
